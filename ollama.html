<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sachin AI — Local</title><style>body{margin:0;background:#0b0d10;color:#f3f4f6;font:15px system-ui;display:flex;height:100vh}aside{width:250px;background:#0d0f12;border-right:1px solid #292e37;padding:16px}.brand{font-size:20px;font-weight:800;display:flex;align-items:center;gap:10px}.logo{width:42px;height:42px;border-radius:12px;object-fit:cover}.new{margin-top:20px;width:100%;padding:11px;background:#171a20;color:#fff;border:1px solid #303641;border-radius:10px}main{flex:1;display:flex;flex-direction:column}header{height:60px;border-bottom:1px solid #292e37;display:flex;align-items:center;padding:0 20px;font-weight:700}.status{margin-left:auto;font-size:12px;color:#8f98a5}.chat{flex:1;overflow:auto;padding:30px 16px 150px}.wrap{max-width:860px;margin:auto}.welcome{text-align:center;margin:9vh auto 40px}.welcome .big{font-size:70px}.welcome h1{font-size:32px;margin:14px}.welcome p{color:#9ba3af}.msg{display:flex;gap:12px;margin:22px 0;line-height:1.65}.avatar{width:34px;height:34px;border-radius:10px;flex:0 0 34px}.bubble{max-width:760px;white-space:pre-wrap}.user .bubble{background:#171a20;border:1px solid #292e37;border-radius:13px;padding:10px 14px}.composer{position:fixed;bottom:16px;left:282px;right:16px}.box{max-width:860px;margin:auto;background:#15181d;border:1px solid #343a45;border-radius:16px;padding:10px;display:flex;gap:8px}textarea{flex:1;background:none;border:0;outline:0;color:#fff;resize:none;padding:9px;font:inherit}.send{width:42px;height:42px;border:0;border-radius:11px;background:#fff;font-weight:800}.hint{text-align:center;color:#69717d;font-size:11px;margin-top:7px}@media(max-width:700px){aside{display:none}.composer{left:12px;right:12px}}
</style></head><body><aside><div class="brand"><img class="logo" src="https://raw.githubusercontent.com/hackerbhaiya951/Manisha-Family-channel-/sachin-ai-site/logo.png">Sachin</div><button class="new" onclick="newChat()">＋ New chat</button><p style="color:#69717d">Local AI</p><p style="font-size:12px;color:#8f98a5">Uses Ollama on your own computer. No API key is required.</p><p style="font-size:12px;color:#8f98a5">Model: llama3.2:1b</p></aside><main><header>Sachin AI <span id="status" class="status">Checking local AI…</span></header><section class="chat" id="chat"><div class="wrap" id="msgs"><div class="welcome"><div class="big">🕷️</div><h1>How can I help you?</h1><p>Local AI mode — your prompts go to Ollama on this device.</p></div></div></section><div class="composer"><div class="box"><textarea id="input" rows="1" placeholder="Message Sachin…"></textarea><button class="send" onclick="send()">↑</button></div><div class="hint">Ollama must be running locally. The model may have its own safety limits.</div></div></main><script>const MODEL='llama3.2:1b',BASE='http://127.0.0.1:11434';const input=document.getElementById('input'),msgs=document.getElementById('msgs'),status=document.getElementById('status');let history=[];function add(role,text){const d=document.createElement('div');d.className='msg '+role;const a=document.createElement('div');a.className='avatar';a.textContent=role==='user'?'You':'🕷️';const b=document.createElement('div');b.className='bubble';b.textContent=text;d.append(a,b);msgs.append(d);document.getElementById('chat').scrollTop=999999}async function check(){try{let r=await fetch(BASE+'/api/tags');status.textContent=r.ok?'Local AI ready':'Ollama unavailable';}catch(e){status.textContent='Start Ollama first'}}async function send(){const text=input.value.trim();if(!text)return;document.querySelector('.welcome')?.remove();add('user',text);history.push({role:'user',content:text});input.value='';status.textContent='Thinking…';try{const r=await fetch(BASE+'/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({model:MODEL,messages:history,stream:false})});if(!r.ok)throw new Error('HTTP '+r.status);const data=await r.json();const reply=data.message?.content||'No response received.';history.push({role:'assistant',content:reply});add('assistant',reply);status.textContent='Local AI ready'}catch(e){add('assistant','Ollama connect nahi hua. Pehle Ollama start karo aur '+MODEL+' model install/run karo. Error: '+e.message);status.textContent='Connection error'}}function newChat(){history=[];msgs.innerHTML='<div class="welcome"><div class="big">🕷️</div><h1>How can I help you?</h1><p>Local AI mode — your prompts go to Ollama on this device.</p></div>'}input.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send()}});check();</script></body></html>
