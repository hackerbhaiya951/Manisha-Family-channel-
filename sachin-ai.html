<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Sachin AI</title>
<style>
:root{--bg:#0b0d10;--panel:#111419;--panel2:#171a20;--line:#292e37;--text:#f3f4f6;--muted:#9ba3af}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial;display:flex;height:100vh;overflow:hidden}.sidebar{width:270px;background:#0d0f12;border-right:1px solid var(--line);display:flex;flex-direction:column;padding:14px}.brand{display:flex;align-items:center;gap:11px;padding:9px 8px 18px;font-weight:800;font-size:20px}.brand img{width:40px;height:40px;border-radius:12px;object-fit:cover;border:1px solid #333}.new{width:100%;padding:11px 13px;border:1px solid #303641;background:#171a20;color:#fff;border-radius:10px;text-align:left;cursor:pointer;font-size:14px}.new:hover{background:#1d2128}.history{margin-top:18px;overflow:auto;flex:1}.label{font-size:11px;color:#69717d;text-transform:uppercase;padding:8px}.item{padding:10px;border-radius:8px;color:#c7ccd4;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer}.item:hover{background:#171a20}.bottom{border-top:1px solid var(--line);padding-top:12px;color:#9ba3af;font-size:12px}.pill{display:inline-block;border:1px solid #303641;border-radius:999px;padding:5px 8px;margin-top:8px}.main{flex:1;display:flex;flex-direction:column;min-width:0}.top{height:60px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 18px}.model{font-weight:700}.status{font-size:12px;color:#8f98a5}.chat{flex:1;overflow:auto;padding:30px 16px 160px}.wrap{max-width:860px;margin:0 auto}.welcome{text-align:center;margin:9vh auto 45px}.welcome img{width:74px;height:74px;border-radius:20px;object-fit:cover;border:1px solid #3a3f47}.welcome h1{font-size:32px;margin:16px 0 8px}.welcome p{color:var(--muted);margin:0}.msg{display:flex;gap:13px;margin:22px 0}.avatar{width:34px;height:34px;border-radius:10px;flex:0 0 34px;object-fit:cover}.useravatar{background:#242832;display:grid;place-items:center;font-size:13px}.bubble{line-height:1.65;font-size:15px;white-space:pre-wrap;max-width:760px}.user .bubble{background:#171a20;border:1px solid #292e37;border-radius:13px;padding:11px 14px}.composer{position:fixed;bottom:0;left:270px;right:0;background:linear-gradient(transparent,var(--bg) 35%);padding:28px 16px 20px}.box{max-width:860px;margin:auto;background:#15181d;border:1px solid #343a45;border-radius:16px;padding:10px;box-shadow:0 8px 35px #0008}.row{display:flex;gap:8px;align-items:end}.box textarea{flex:1;background:transparent;border:0;outline:0;color:#fff;resize:none;min-height:48px;max-height:180px;padding:9px;font:inherit}.send{width:42px;height:42px;border:0;border-radius:11px;background:#fff;color:#000;font-weight:800;cursor:pointer}.send:disabled{opacity:.35;cursor:default}.hint{text-align:center;color:#69717d;font-size:11px;margin-top:8px}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:25px}.card{background:#12151a;border:1px solid #292e37;border-radius:12px;padding:13px;text-align:left;color:#c8cdd5;cursor:pointer}.card b{display:block;color:#fff;margin-bottom:4px}.card span{font-size:12px;color:#818a97}@media(max-width:700px){.sidebar{display:none}.composer{left:0}.cards{grid-template-columns:1fr}.welcome{margin-top:5vh}.welcome h1{font-size:27px}.chat{padding-bottom:145px}}
</style></head><body>
<aside class="sidebar"><div class="brand"><img src="data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAP//////////////////////////////////////////////////////////////////////////////////////2wBDAf//////////////////////////////////////////////////////////////////////////////////////wAARCAABAQADASIAAhEBAxEB/8QAFQABAQAAAAAAAAAAAAAAAAAAAAX/xAAUEAEAAAAAAAAAAAAAAAAAAAAA/9oADAMBAAIQAxAAAAH/xAAUEAEAAAAAAAAAAAAAAAAAAAAA/9oACAEBAAEFAqf/xAAUEQEAAAAAAAAAAAAAAAAAAAAA/9oACAEDAQE/AX//xAAUEQEAAAAAAAAAAAAAAAAAAAAA/9oACAECAQE/AX//xAAUEAEAAAAAAAAAAAAAAAAAAAAA/9oACAEBAAY/Ap//xAAUEAEAAAAAAAAAAAAAAAAAAAAA/9oACAEBAAE/IYf/2gAMAwEAAgADAAAAEP/EABQRAQAAAAAAAAAAAAAAAAAAABD/2gAIAQMBAT8Qf//EABQRAQAAAAAAAAAAAAAAAAAAABD/2gAIAQIBAT8Qf//EABQQAQAAAAAAAAAAAAAAAAAAABD/2gAIAQEAAT8Qf//Z">Sachin</div><button class="new" onclick="newChat()">＋ New chat</button><div class="history"><div class="label">Recent</div><div id="history"></div></div><div class="bottom">Sachin AI <span class="pill">Unlimited UI</span><br><br>AI responses require a configured model/API.</div></aside>
<main class="main"><header class="top"><div class="model">Sachin AI</div><div class="status">Private workspace • Demo mode</div></header><section class="chat" id="chat"><div class="wrap" id="messages"><div class="welcome"><img src="data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAP//////////////////////////////////////////////////////////////////////////////////////2wBDAf//////////////////////////////////////////////////////////////////////////////////////wAARCAABAQADASIAAhEBAxEB/8QAFQABAQAAAAAAAAAAAAAAAAAAAAX/xAAUEAEAAAAAAAAAAAAAAAAAAAAA/9oADAMBAAIQAxAAAAH/xAAUEAEAAAAAAAAAAAAAAAAAAAAA/9oACAEBAAEFAqf/xAAUEQEAAAAAAAAAAAAAAAAAAAAA/9oACAEDAQE/AX//xAAUEQEAAAAAAAAAAAAAAAAAAAAA/9oACAECAQE/AX//xAAUEAEAAAAAAAAAAAAAAAAAAAAA/9oACAEBAAY/Ap//xAAUEAEAAAAAAAAAAAAAAAAAAAAA/9oACAEBAAE/IYf/2gAMAwEAAgADAAAAEP/EABQRAQAAAAAAAAAAAAAAAAAAABD/2gAIAQMBAT8Qf//EABQRAQAAAAAAAAAAAAAAAAAAABD/2gAIAQIBAT8Qf//EABQQAQAAAAAAAAAAAAAAAAAAABD/2gAIAQEAAT8Qf//Z"><h1>How can I help you?</h1><p>Welcome to Sachin — a clean DeepSeek-style AI workspace.</p><div class="cards"><button class="card" onclick="fill('Explain quantum physics simply')"><b>Explain</b><span>Break down a hard topic</span></button><button class="card" onclick="fill('Write a Python program for a calculator')"><b>Code</b><span>Build and debug code</span></button><button class="card" onclick="fill('Give me 5 creative YouTube ideas')"><b>Create</b><span>Brainstorm something new</span></button></div></div></div></section>
<div class="composer"><div class="box"><div class="row"><textarea id="input" rows="1" placeholder="Message Sachin..." oninput="resize(this);toggle()" onkeydown="key(event)"></textarea><button id="send" class="send" onclick="send()">↑</button></div></div><div class="hint">Sachin can make mistakes. Connect your own model API for real AI responses.</div></div></main>
<script>const input=document.getElementById('input'),sendBtn=document.getElementById('send'),messages=document.getElementById('messages'),history=document.getElementById('history');function resize(t){t.style.height='auto';t.style.height=Math.min(t.scrollHeight,180)+'px'}function toggle(){sendBtn.disabled=!input.value.trim()}function fill(x){input.value=x;resize(input);toggle();input.focus()}function key(e){if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send()}}function newChat(){messages.innerHTML='<div class="welcome"><h1>How can I help you?</h1><p>Start a new conversation with Sachin.</p></div>';input.value='';resize(input);toggle()}function add(role,text){const d=document.createElement('div');d.className='msg '+role;const a=document.createElement(role==='user'?'div':'img');a.className='avatar '+(role==='user'?'useravatar':'');if(role==='user')a.textContent='You';else a.src='data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAP//////////////////////////////////////////////////////////////////////////////////////2wBDAf//////////////////////////////////////////////////////////////////////////////////////wAARCAABAQADASIAAhEBAxEB/8QAFQABAQAAAAAAAAAAAAAAAAAAAAX/xAAUEAEAAAAAAAAAAAAAAAAAAAAA/9oADAMBAAIQAxAAAAH/xAAUEAEAAAAAAAAAAAAAAAAAAAAA/9oACAEBAAEFAqf/xAAUEQEAAAAAAAAAAAAAAAAAAAAA/9oACAEDAQE/AX//xAAUEQEAAAAAAAAAAAAAAAAAAAAA/9oACAECAQE/AX//xAAUEAEAAAAAAAAAAAAAAAAAAAAA/9oACAEBAAY/Ap//xAAUEAEAAAAAAAAAAAAAAAAAAAAA/9oACAEBAAE/IYf/2gAMAwEAAgADAAAAEP/EABQRAQAAAAAAAAAAAAAAAAAAABD/2gAIAQMBAT8Qf//EABQRAQAAAAAAAAAAAAAAAAAAABD/2gAIAQIBAT8Qf//EABQQAQAAAAAAAAAAAAAAAAAAABD/2gAIAQEAAT8Qf//Z';const b=document.createElement('div');b.className='bubble';b.textContent=text;d.append(a,b);messages.appendChild(d);document.getElementById('chat').scrollTop=999999}function send(){const text=input.value.trim();if(!text)return;const welcome=document.querySelector('.welcome');if(welcome)welcome.remove();add('user',text);const h=document.createElement('div');h.className='item';h.textContent=text;history.prepend(h);input.value='';resize(input);toggle();setTimeout(()=>add('ai',demo(text)),350)}function demo(t){const s=t.toLowerCase();if(s.includes('hello')||s.includes('hi'))return 'Hey! I’m Sachin. 👋 This site is ready as a DeepSeek-style interface. Connect an AI API to turn demo replies into real model responses.';if(s.includes('code')||s.includes('python'))return 'I can help with coding, debugging, explanations and project structure. This demo frontend currently does not call a model API.';return 'I’m Sachin AI. The interface is ready, but real AI generation needs a model/API connection. The visual UI has no artificial message-count limit.'}toggle();</script></body></html>
